name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.2 (pass a version that already exists to only refresh the MCP Registry entry)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: nuget

    env:
      PROJECT_PATH: CSharpAnalyserMcp/CSharpAnalyserMcp.csproj
      SERVER_JSON_PATH: CSharpAnalyserMcp/.mcp/server.json
      NUGET_PACKAGE_ID: CSharpAnalyserMcp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PKG_VERSION, not VERSION: MSBuild imports environment variables as
      # properties, so an env var named VERSION would override $(Version), and a
      # version string that NuGet cannot parse breaks `dotnet restore`.
      - name: Resolve version
        run: |
          RAW="${{ inputs.version }}"
          [ -n "$RAW" ] || RAW="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid NuGet version (use e.g. 1.0.2 or 1.0.1-a)."
            exit 1
          fi
          echo "PKG_VERSION=$RAW" >> "$GITHUB_ENV"
          echo "publishing $NUGET_PACKAGE_ID $RAW"

      # Runs before pack: the same file is embedded in the package and published
      # to the registry, so both must carry the released version.
      - name: Sync the version into server.json
        run: |
          jq --arg v "$PKG_VERSION" '.version = $v | .packages[0].version = $v' "${{ env.SERVER_JSON_PATH }}" > server.tmp
          mv server.tmp "${{ env.SERVER_JSON_PATH }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore -p:Version=${{ env.PKG_VERSION }}

      - name: Pack NuGet package
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./nupkg -p:Version=${{ env.PKG_VERSION }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # The gallery page flips as soon as the version is listed. The
      # flat-container blob paths cache their 404s for a long time, so polling
      # them can keep failing long after a successful publish.
      - name: Wait until the package is listed on NuGet.org
        run: |
          URL="https://www.nuget.org/packages/$NUGET_PACKAGE_ID/$PKG_VERSION"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL?cb=$i$RANDOM")
            if [ "$CODE" = "200" ]; then
              echo "$NUGET_PACKAGE_ID $PKG_VERSION is listed on NuGet.org"
              exit 0
            fi
            echo "attempt $i/40: gallery HTTP $CODE, waiting 15s"
            sleep 15
          done
          echo "::error::$NUGET_PACKAGE_ID $PKG_VERSION is not listed on NuGet.org after 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate ${{ env.SERVER_JSON_PATH }}

      # `publish` takes the file as a positional argument (there is no --file
      # flag) and re-checks the package on NuGet, which can lag behind the push.
      - name: Publish to MCP Registry
        run: |
          for i in 1 2 3; do
            if ./mcp-publisher publish "${{ env.SERVER_JSON_PATH }}"; then
              exit 0
            fi
            echo "publish attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1
