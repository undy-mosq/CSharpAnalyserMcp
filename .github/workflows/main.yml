name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./CSharpAnalyserMcp/CSharpAnalyserMcp.csproj

      - name: Build
        run: dotnet build ./CSharpAnalyserMcp/CSharpAnalyserMcp.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack ./CSharpAnalyserMcp/CSharpAnalyserMcp.csproj --configuration Release --no-build --output ./nupkg

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
